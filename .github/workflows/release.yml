# A release, from a version tag: git tag v1.0 && git push origin v1.0.
# Tests everything, builds what make release builds, and publishes it as
# the GitHub release that scripts/install.sh and potato.video point at.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make test
      - run: make release VERSION="$GITHUB_REF_NAME"
      - run: gh release create "$GITHUB_REF_NAME" dist/* --title "mvd $GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
